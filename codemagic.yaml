workflows:
  ios-testflight:
    name: iOS signed IPA and TestFlight upload
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: vn.edu.vanchuongphieuluuky
      groups:
        - app_store_connect_credentials
      vars:
        XCODE_PROJECT: ios/VanChuongPhieuLuuKy.xcodeproj
        XCODE_SCHEME: VanChuongPhieuLuuKy
      xcode: latest
    scripts:
      - name: Build signed IPA
        script: |
          set -eu
          if [ -f "ios/VanChuongPhieuLuuKy.xcodeproj/project.pbxproj" ]; then
            SOURCE_DIR="$PWD"
          elif [ -f "VanChuongPhieuLuuKy-iOS-source/ios/VanChuongPhieuLuuKy.xcodeproj/project.pbxproj" ]; then
            SOURCE_DIR="$PWD/VanChuongPhieuLuuKy-iOS-source"
          elif [ -f "VanChuongPhieuLuuKy-iOS-source.zip" ]; then
            SOURCE_DIR="$PWD/codemagic-source"
            mkdir -p "$SOURCE_DIR"
            unzip -oq "VanChuongPhieuLuuKy-iOS-source.zip" -d "$SOURCE_DIR"
          else
            echo "Missing Xcode project or VanChuongPhieuLuuKy-iOS-source.zip in repository root."
            exit 1
          fi

          cd "$SOURCE_DIR"
          xcode-project use-profiles
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "Created signed IPA: $IPA_PATH"
    artifacts:
      - ios/build/ios/ipa/*.ipa
      - VanChuongPhieuLuuKy-iOS-source/build/ios/ipa/*.ipa
      - codemagic-source/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
